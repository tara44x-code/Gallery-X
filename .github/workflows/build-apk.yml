name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The signing key never lives in the repository: it comes from the repo's Secrets.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are missing; the APK will be unsigned and will not install."
            exit 0
          fi
          mkdir -p secure
          echo "$KEYSTORE_BASE64" | base64 -d > secure/gallery-x-release.jks
          {
            echo "storeFile=gallery-x-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=galleryx"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > secure/keystore.properties

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          VERSION=$(grep versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "Gallery-X-v${VERSION}.apk"
          echo "APK_FILE=Gallery-X-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          name: Gallery X ${{ env.VERSION }}

      - name: Remove signing key
        if: always()
        run: rm -f secure/gallery-x-release.jks secure/keystore.properties
